<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap">
<title>SROI 訪談預約</title>
<meta name="description" content="人社中心 USR Hub SROI 訪談時間預約">
<style>
:root{
  --bg:#FAFAF9; --surface:#FFFFFF; --line:#E4E4E0; --ink:#151515; --ink-2:#55554F;
  --accent:#1F3FBF; --accent-soft:#EEF1FC; --ok:#17603A; --ok-soft:#E9F5EE; --err:#9B1C1C;
  --radius:10px;
  --font:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 var(--font)}
main{max-width:760px;margin:0 auto;padding:56px 16px 96px}
.eyebrow{font-size:13px;letter-spacing:.08em;color:var(--ink-2);margin:0 0 12px}
h1{font-size:clamp(28px,5vw,40px);line-height:1.25;letter-spacing:-.01em;margin:0 0 16px;font-weight:650}
.lead{color:var(--ink-2);margin:0 0 8px;max-width:34em}
.meta{display:flex;gap:8px 20px;flex-wrap:wrap;margin:20px 0 40px;padding:0;list-style:none;font-size:14px;color:var(--ink-2)}
.meta li::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:8px;vertical-align:middle}
.day{margin:0 0 28px}
.day h2{display:flex;align-items:baseline;gap:10px;font-size:15px;margin:0 0 10px;font-weight:600}
.day h2 small{font-weight:400;color:var(--ink-2);font-size:13px}
.tag{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:0 8px;color:var(--ink-2);background:var(--surface)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.slot{appearance:none;font:inherit;text-align:left;cursor:pointer;color:var(--ink);background:var(--surface);
  border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px;
  transition:border-color .18s,box-shadow .18s,transform .18s,background .18s}
.slot b{font-weight:600;font-variant-numeric:tabular-nums}
.slot span{font-size:13px;color:var(--ink-2)}
@media (hover:hover){.slot:hover:not([aria-disabled=true]){border-color:var(--accent);box-shadow:0 4px 16px rgba(31,63,191,.10);transform:translateY(-1px)}}
.slot:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.slot[aria-disabled=true]{cursor:not-allowed;background:#F1F1EE;color:#6A6A64}
.slot[aria-disabled=true] b{text-decoration:line-through}
.slot.mine{background:var(--ok-soft);border-color:var(--ok);color:var(--ok);cursor:default}
.slot.mine span{color:var(--ok)}
.state{color:var(--ink-2);padding:24px 0}
.state.err{color:var(--err)}
/* dialog */
dialog{border:1px solid var(--line);border-radius:14px;padding:0;width:min(440px,calc(100% - 32px));background:var(--surface);color:var(--ink);box-shadow:0 24px 64px rgba(0,0,0,.18)}
dialog::backdrop{background:rgba(21,21,21,.38)}
form{padding:24px}
form h3{margin:0 0 4px;font-size:20px}
form p.sub{margin:0 0 20px;color:var(--ink-2);font-size:14px}
label{display:block;font-size:14px;font-weight:600;margin:16px 0 6px}
select,input,textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid #BDBDB6;border-radius:8px;background:#fff;color:var(--ink)}
textarea{resize:vertical;min-height:72px}
.seg{display:flex;gap:8px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{margin:0;flex:1;text-align:center;font-weight:500;border:1px solid #BDBDB6;border-radius:8px;padding:10px;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
.seg input:checked+label{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.seg input:focus-visible+label{outline:2px solid var(--accent);outline-offset:2px}
.actions{display:flex;gap:10px;justify-content:flex-end;margin-top:24px}
.btn{font:inherit;font-weight:600;padding:10px 18px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;transition:background .15s,transform .15s}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
@media (hover:hover){.btn:hover{transform:translateY(-1px)}}
.btn[disabled]{opacity:.6;cursor:wait;transform:none}
.msg{margin:16px 0 0;font-size:14px;color:var(--err);min-height:1.4em}
.done{padding:32px 24px;text-align:center}
.done .tick{width:44px;height:44px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;margin:0 auto 14px;font-size:22px}
footer{margin-top:48px;font-size:13px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:16px}
/* weekly calendar: columns = dates, rows = time */
:root{--row:30px;--hatch:#E9E9E4}
main{max-width:980px}
.cal-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 0 12px}
.cal{display:grid;min-width:640px;column-gap:6px;padding:0 12px}
.cal .hd{position:sticky;top:0;padding:14px 4px 10px;text-align:center;font-weight:600;font-size:15px;line-height:1.3;border-bottom:1px solid var(--line);background:var(--surface);font-variant-numeric:tabular-nums}
.cal .hd small{display:block;font-weight:400;font-size:12px;color:var(--ink-2)}
.cal .hd .tag{margin-top:4px;display:inline-block}
.cal .tm{font-size:12px;color:var(--ink-2);text-align:right;padding-right:8px;transform:translateY(-.6em);font-variant-numeric:tabular-nums}
.cal .col{background:repeating-linear-gradient(135deg,transparent 0 6px,var(--hatch) 6px 7px);border-left:1px solid var(--line);border-right:1px solid var(--line)}
.cal .gap{grid-row:1 / -1}
.cal .slot{flex-direction:column;align-items:flex-start;justify-content:center;gap:2px;margin:3px 4px;padding:8px 10px;z-index:1;min-width:0}
.cal .slot b{font-size:14px}
.hint{display:none;font-size:13px;color:var(--ink-2);margin:0 0 8px}
@media (max-width:700px){.hint{display:block}}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin:0 0 12px;font-size:13px;color:var(--ink-2)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px;border:1px solid var(--line)}
@media (prefers-reduced-motion:no-preference){
  .rise{animation:rise .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0)*60ms)}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  dialog[open]{animation:pop .22s cubic-bezier(.2,.7,.2,1)}
  @keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
  .slot.flash{animation:flash .9s ease-out}
  @keyframes flash{from{box-shadow:0 0 0 6px rgba(23,96,58,.25)}to{box-shadow:0 0 0 0 rgba(23,96,58,0)}}
}
</style>
</head>
<body>
<main>
  <p class="eyebrow">人社中心 USR Hub　·　SROI 研究</p>
  <h1>SROI 訪談時間預約</h1>
  <p class="lead">誠摯邀請您分享推動 USR 的實務經驗。請選擇一個方便的時段，送出後即完成預約，系統會同步通知助理。</p>
  <ul class="meta"><li>每場 1–1.5 小時</li><li>面訪或線上皆可</li><li>每位老師預約一個時段，可隨時改選</li></ul>
  <div id="app" aria-live="polite"><p class="state">載入時段中…</p></div>
  <footer>若時段都不方便，或需要協助，請直接回信給助理（陳聿盛），我們會另行安排。</footer>
</main>

<dialog id="dlg">
  <form method="dialog" id="form">
    <h3 id="dTitle">預約時段</h3>
    <p class="sub" id="dSub"></p>
    <label for="name">老師姓名</label>
    <select id="name" required><option value="">請選擇</option></select>
    <label id="modeL">訪談形式</label>
    <div class="seg" role="radiogroup" aria-labelledby="modeL">
      <input type="radio" name="mode" id="m1" value="面訪" checked><label for="m1">面訪</label>
      <input type="radio" name="mode" id="m2" value="線上"><label for="m2">線上</label>
    </div>
    <label for="note">備註（選填）</label>
    <textarea id="note" placeholder="例如：希望地點在系館、需要提早結束的時間"></textarea>
    <p class="msg" id="msg" role="alert"></p>
    <div class="actions">
      <button type="button" class="btn" id="cancel">取消</button>
      <button type="submit" class="btn primary" id="ok">確認預約</button>
    </div>
  </form>
</dialog>

<script>
// Paste the Apps Script web-app URL (ends with /exec). Empty = demo mode with sample data (nothing is saved).
const API_URL = "";
const TEACHERS = ["楊詩弘","楊佳翰","黃仲菁","陳璽任"];

const $ = s => document.querySelector(s);
const app = $("#app"), dlg = $("#dlg"), nameSel = $("#name");
TEACHERS.forEach(t => nameSel.add(new Option(t, t)));

let slots = [], mine = null, current = null;
const demoSlots = () => [
  ["10/29","四","10:30–12:00","優先"],["10/29","四","12:00–13:30","優先"],
  ["10/30","五","10:30–12:00","優先"],["10/30","五","13:00–14:30","優先"],["10/30","五","14:30–16:00","優先"],["10/30","五","16:00–17:30","優先"],
  ["11/4","三","13:00–14:30","備用"],
  ["11/5","四","10:30–12:00","優先"],["11/5","四","13:00–14:30","優先"],["11/5","四","14:30–16:00","優先"],["11/5","四","16:00–17:30","優先"],
  ["11/6","五","13:00–14:30","備用"]
].map((a,i)=>({row:6+i,date:a[0],weekday:a[1],time:a[2],tier:a[3],taken:i===1}));

async function load(){
  if(!API_URL){ slots = slots.length ? slots : demoSlots(); return render(); }
  try{
    const r = await fetch(API_URL); const j = await r.json();
    if(!j.ok) throw new Error(j.error);
    slots = j.slots; render();
  }catch(e){ app.innerHTML = '<p class="state err">暫時無法讀取時段，請稍後重新整理，或直接回信給助理。</p>'; }
}

function render(){
  const mins = s => { const [h,m] = s.split("–")[0].split(":"); return h*60 + +m; };
  const endm = s => { const [h,m] = s.split("–")[1].split(":"); return h*60 + +m; };
  const days = [...new Set(slots.map(s=>s.date))];
  const wk = d => { const [m,dd] = d.split("/").map(Number); const x = new Date(2026,m-1,dd); x.setDate(x.getDate()-((x.getDay()+6)%7)); return +x; };
  const t0 = Math.min(...slots.map(s=>mins(s.time))), t1 = Math.max(...slots.map(s=>endm(s.time)));
  const N = (t1-t0)/30;
  const colOf = {}; const cols = ["64px"]; let c = 2, prev = null;
  days.forEach(d=>{
    if(prev!==null && wk(d)!==prev){ cols.push("10px"); c++; }
    cols.push("minmax(104px,1fr)"); colOf[d]=c; c++; prev = wk(d);
  });
  let h = "";
  h += `<div class="hd" style="grid-row:1;grid-column:1"></div>`;
  days.forEach(d=>{ const s = slots.find(x=>x.date===d);
    h += `<div class="hd" style="grid-row:1;grid-column:${colOf[d]}">${d}<small>週${s.weekday}</small>${s.tier==="備用"?'<span class="tag">備用日</span>':""}</div>`; });
  for(let i=0;i<N;i++){ const m=t0+i*30, hh=Math.floor(m/60), mm=m%60;
    h += `<div class="tm" style="grid-row:${i+2};grid-column:1">${hh}:${String(mm).padStart(2,"0")}</div>`; }
  days.forEach(d=>{ h += `<div class="col" style="grid-row:2 / span ${N};grid-column:${colOf[d]}"></div>`; });
  slots.forEach(s=>{
    const r0 = (mins(s.time)-t0)/30 + 2, span = (endm(s.time)-mins(s.time))/30;
    const isMine = mine===s.row, dis = (s.taken && !isMine) ? 'aria-disabled="true"' : "";
    const tail = isMine?"您已預約" : s.taken?"已被預約" : "可預約";
    h += `<button class="slot${isMine?" mine":""}" data-row="${s.row}" ${dis} style="grid-row:${r0} / span ${span};grid-column:${colOf[s.date]}" aria-label="${s.date} ${s.time} ${tail}"><b>${s.time}</b><span>${tail}</span></button>`;
  });
  app.innerHTML = `<p class="hint">← 左右滑動可看其他日期 →</p><div class="legend"><span><i style="background:#fff"></i>可預約</span><span><i style="background:#F1F1EE"></i>已被預約</span><span><i style="background:repeating-linear-gradient(135deg,#fff 0 3px,#E9E9E4 3px 4px)"></i>不開放</span></div>
    <div class="cal-wrap rise"><div class="cal" style="grid-template-columns:${cols.join(" ")};grid-template-rows:auto repeat(${N},var(--row))">${h}</div></div>`;
}

app.addEventListener("click", e=>{
  const b = e.target.closest(".slot"); if(!b || b.getAttribute("aria-disabled")==="true") return;
  current = slots.find(s=>s.row===Number(b.dataset.row));
  if(mine===current.row) return;
  $("#dSub").textContent = `${current.date}（${current.weekday}）${current.time}`;
  $("#msg").textContent = ""; $("#ok").disabled = false; $("#ok").textContent = "確認預約";
  dlg.showModal();
});
$("#cancel").onclick = ()=>dlg.close();

$("#form").addEventListener("submit", async e=>{
  e.preventDefault();
  const name = nameSel.value; if(!name){ $("#msg").textContent="請先選擇您的姓名"; return; }
  const body = {row:current.row, time:current.time, name, mode:document.querySelector("input[name=mode]:checked").value, note:$("#note").value.trim()};
  const ok = $("#ok"); ok.disabled = true; ok.textContent = "送出中…"; $("#msg").textContent="";
  try{
    if(API_URL){
      const r = await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body)});
      const j = await r.json(); if(!j.ok) throw new Error(j.error);
    }
    slots.forEach(s=>{ if(s.row===mine) s.taken=false; });
    current.taken = true; mine = current.row;
    dlg.innerHTML = `<div class="done"><div class="tick" aria-hidden="true">✓</div><h3>預約完成</h3>
      <p class="sub">${name} 老師，已為您保留<br><b>${current.date}（${current.weekday}）${current.time}</b>（${body.mode}）。<br>助理會再寄確認信與行事曆邀請。</p>
      <button class="btn primary" onclick="location.reload()" style="margin-top:8px">完成</button></div>`;
    render(); document.querySelector(`.slot[data-row="${mine}"]`)?.classList.add("flash");
  }catch(err){
    $("#msg").textContent = (err.message && err.message.length<60 ? err.message : "送出失敗，請重試或回信給助理。");
    ok.disabled=false; ok.textContent="確認預約"; if(API_URL) load();
  }
});
dlg.addEventListener("close",()=>{ if(dlg.querySelector(".done")) location.reload(); });
load();
</script>
</body>
</html>
